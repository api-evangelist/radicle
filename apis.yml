aid: radicle
name: Radicle
description: >-
  Radicle is a sovereign, peer-to-peer code collaboration stack built on Git,
  developed by Radicle (radicle.dev) and backed by Electric Capital. Instead of
  relying on a central host, every user runs their own node, and repositories,
  issues and patches replicate across the network as cryptographically-signed
  Collaborative Objects (COBs). The stack ships the `rad` command-line tooling,
  the Heartwood protocol and node, a terminal UI, a desktop app, and a web
  explorer. Each node can run `radicle-httpd`, a lightweight HTTP daemon that
  exposes a read-oriented JSON API over the node's storage — repositories,
  issues, patches, commits, source trees, node info and network statistics —
  which powers the Radicle web explorer and third-party tooling. Identity is
  key-based (DIDs / did:key), so there are no accounts, passwords or platform
  lock-in. This profile was enriched from Radicle's public surface: the live
  seed node API, the security.txt, the Heartwood source, and the CLI manuals.
