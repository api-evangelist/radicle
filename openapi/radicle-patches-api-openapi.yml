openapi: 3.2.0
info:
  title: Radicle HTTP API (radicle-httpd) Patches API
  version: 6.1.0
  x-generated: '2026-07-20'
  x-method: searched
  x-source: https://seed.radicle.xyz/api/v1
  description: Radicle is a sovereign, peer-to-peer code collaboration stack built on Git.
  contact:
    name: Radicle
    url: https://radicle.dev/
  license:
    name: MIT OR Apache-2.0
servers:
- url: https://seed.radicle.xyz/api/v1
  description: Public community seed node (read-only)
- url: https://{node}/api/v1
  description: Any self-hosted radicle-httpd node
  variables:
    node:
      default: seed.radicle.xyz
tags:
- name: Patches
  description: Repository patches (change proposals)
paths:
  /repos/{rid}/patches:
    get:
      tags:
      - Patches
      operationId: listPatches
      summary: List repository patches
      parameters:
      - $ref: '#/components/parameters/Rid'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - draft
          - archived
          - merged
      responses:
        '200':
          description: Array of patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patch'
  /repos/{rid}/patches/{patchId}:
    get:
      tags:
      - Patches
      operationId: getPatch
      summary: Get a patch
      parameters:
      - $ref: '#/components/parameters/Rid'
      - name: patchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Patch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    Rid:
      name: rid
      in: path
      required: true
      description: Repository ID (e.g. rad:z6cFWeWpnZNHh9rUW8phgA3b5yGt)
      schema:
        type: string
  schemas:
    Error:
      type: object
      description: Error envelope returned by radicle-httpd.
      properties:
        error:
          type: string
        code:
          type: integer
      required:
      - error
      - code
    Did:
      type: object
      properties:
        id:
          type: string
          description: DID (did:key:...)
        alias:
          type: string
    Patch:
      type: object
      properties:
        id:
          type: string
        author:
          $ref: '#/components/schemas/Did'
        title:
          type: string
        state:
          type: object
          properties:
            status:
              type: string
              enum:
              - open
              - draft
              - archived
              - merged
        target:
          type: string
        labels:
          type: array
          items:
            type: string
        merges:
          type: array
          items:
            type: object
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/Did'
        revisions:
          type: array
          items:
            type: object
